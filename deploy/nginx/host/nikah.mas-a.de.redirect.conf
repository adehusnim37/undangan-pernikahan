server {
    listen 80;
    listen [::]:80;

    server_name nikah.mas-a.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://nikah.alvitade.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name nikah.mas-a.de;

    # Sertifikat domain lama tetap diperlukan agar redirect HTTPS diterima browser.
    ssl_certificate /etc/letsencrypt/live/nikah.mas-a.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikah.mas-a.de/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://nikah.alvitade.com$request_uri;
}
