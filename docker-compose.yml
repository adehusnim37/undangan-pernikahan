services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    image: undangan-pernikahan:latest
    container_name: undangan-pernikahan
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      # Hanya bind ke loopback: nginx di host yang melayani publik.
      # Jika tidak ada nginx, ubah menjadi "${PORT:-3000}:${PORT:-3000}".
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
